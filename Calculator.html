<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Magician</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>

  <!-- Header -->
  <div class="card">
    <h1>Math Magician</h1>

    <a href="index.html">Home</a>
    <a class="active" href="Calculator.html">Calculator</a>
    <a href="Quote.html">Quote</a>
  </div>

  <!-- Left side -->
  <h2 class="text">Lets Do Some Math...</h2>

  <!-- Calculator -->
  <div class="calculator">

    <input type="text" id="display" readonly>

    <div class="buttons">

      <button>AC</button>
      <button>+/-</button>
      <button>%</button>
      <button class="orange">+</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="orange">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="orange">-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="orange">+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button class="orange">=</button>

    </div>
  </div>

</body>
</html>
